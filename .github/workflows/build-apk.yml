name: Build APK

on:
  push:
    branches: [portx-launcher]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Add native plugin, MainActivity and icons
        run: |
          mkdir -p android/app/src/main/java/com/portx/launcher
          cp android-native/java/com/portx/launcher/*.java android/app/src/main/java/com/portx/launcher/
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $RES/mipmap-$d
            cp android-native/res/mipmap-$d/* $RES/mipmap-$d/
          done
          mkdir -p $RES/mipmap-anydpi-v26 $RES/drawable $RES/values
          cp android-native/res/mipmap-anydpi-v26/*.xml $RES/mipmap-anydpi-v26/
          cp android-native/res/drawable/ic_launcher_foreground.png $RES/drawable/
          cp android-native/res/values/ic_launcher_background.xml $RES/values/

      - name: Merge manifest and gradle additions
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          add = '''    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              '''
          assert "<application" in s
          s = s.replace("<application", add + "<application", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          sed -i '/^dependencies {/a\    implementation "androidx.documentfile:documentfile:1.0.1"' android/app/build.gradle
          grep -n documentfile android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PORTX-Game-Launcher.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PORTX-Game-Launcher
          path: PORTX-Game-Launcher.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PORTX Game Launcher (latest build)
          files: PORTX-Game-Launcher.apk
          make_latest: true
