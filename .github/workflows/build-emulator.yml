name: Build PORTX EMULATOR

on:
  push:
    branches: [portx-emulator]
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/brunodev85/winlator-app
  UPSTREAM_COMMIT: f8a211ce7fd776de9a2642b45d166016876eaa86   # Winlator 11.2 (LGPL-2.1)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch pinned upstream source
        run: |
          git clone "$UPSTREAM_REPO" upstream
          git -C upstream checkout "$UPSTREAM_COMMIT"
          git -C upstream log -1 --format='upstream: %h %ad %s'

      - name: Apply PORTX overlay
        run: ./scripts/apply-overlay.sh upstream

      - name: Install SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK=$(find upstream/app/build/outputs/apk/debug -name '*.apk' | head -1)
          ls -lh "$APK"
          cp "$APK" PORTX-EMULATOR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PORTX-EMULATOR
          path: PORTX-EMULATOR.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: emulator-latest
          name: PORTX EMULATOR (latest build)
          files: PORTX-EMULATOR.apk
          prerelease: true
